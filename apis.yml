aid: total-expert
name: Total Expert
description: >-
  Total Expert is a fintech CRM and customer-engagement platform built for
  banks, credit unions, lenders, and mortgage companies. Its Public API is a
  REST/JSON surface at public.totalexpert.net/v1, secured with OAuth 2.0
  (client-credentials for admin integrations, authorization-code for
  user-level access), covering contacts, leads, loans, insights, surveys,
  campaigns, users, teams, accounts, and webhook subscriptions, with
  documented deduplication, pagination, and rate-limit contracts and an
  isolated sandbox environment for integration partners.
