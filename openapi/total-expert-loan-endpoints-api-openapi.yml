openapi: 3.2.0
info:
  title: Total Expert Public Loan Endpoints API
  version: v1
  description: The Total Expert REST API allows you to programmatically create, retrieve, update, and delete information through various endpoints.
  contact:
    url: https://developer.totalexpert.net
servers:
- url: https://public.totalexpert.net
  description: Total Expert external API — production
- url: https://public.vt.totalexpert.net
  description: Total Expert external API — development/sandbox domain (isolated from live data; per the Vendor OAuth Integration Guide)
security:
- oauth2: []
tags:
- name: Loan Endpoints
paths:
  /v1/loans/{loan_id}:
    get:
      operationId: fetchLoan
      summary: Fetch Loan
      description: Fetch a specific loan type specified by ID.
      tags:
      - Loan Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: loan_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateLoan
      summary: Update Loan
      description: Update an existing loan by ID.
      tags:
      - Loan Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: loan_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              external_id: '2161006'
              loan_number: '2161006'
              loan_rate: '4.00'
              loan_term: 360
              appraised_value: '450000.00'
              is_first_time_buyer: 0
              address: 446 Second St
              city: Middlesex
              state: NJ
              zip_code: 8846
              loan_amount: '357904.00'
              loan_to_value_combined: '86.24'
              occupancy_type: Owner
              lock_status: Locked
              escrow_waived: 0
              application_date: '2016-07-27 00:00:00'
              appraisal_ordered_date: '2017-04-21 00:00:00'
              appraisal_received_date: '2017-04-28 00:00:00'
              closing_date: '2017-05-19 00:00:00'
              created_date: '2017-06-06 15:51:19'
              last_modified_date: '2017-05-15 06:55:00'
              first_payment_date: '2017-06-01 00:00:00'
              lock_date: '2017-04-26 00:00:00'
              lock_expiration_date: '2017-05-25 00:00:00'
              processing_start_date: '2016-08-05 00:00:00'
              underwriting_submission_date: '2016-08-02 00:00:00'
              internal_created_at: '2017-06-06 15:51:19'
              internal_updated_at: '2017-06-06 15:51:20'
              coborrower:
                id: 1186
              loan_program:
                loan_program: 30-year Fixed
              loan_purpose:
                loan_purpose: New
              loan_status:
                loan_status: In review
              loan_type:
                loan_type: Conventional Fixed Rate
              account_class:
                class_name: mortgage
                class_type: LOAN
    delete:
      operationId: deleteLoan
      summary: Delete Loan
      description: Deletes a loan by ID.
      tags:
      - Loan Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: loan_id
        in: path
        required: true
        schema:
          type: string
  /v1/loans:
    get:
      operationId: fetchLoans
      summary: Fetch Loans
      description: Fetch a page of loans. Specify page size and page number via the '?page[size]' and '?page[number]' GET parameters.
      tags:
      - Loan Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: page[number]
        in: query
        required: false
        schema:
          type: string
        example: '1'
      - name: page[size]
        in: query
        required: false
        schema:
          type: string
        example: '10'
    post:
      operationId: createLoanAsAdmin
      summary: Create Loan (as Admin)
      description: 'Create a loan.


        Required Attributes:


        external_id


        Required Relationships:


        owner


        borrower

        Must have required fields for contact creation, found here: Create Contact (as Admin)


        any other required loan participant roles, which can be found using the Fetch Loan Participant Roles request (requires describeSchema scope to access)


        Alternate documented request: Create Loan (as User).'
      tags:
      - Loan Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  external_id: '2161010'
                  loan_number: '2161010'
                  address: 446 Second St
                  city: Middlesex
                  state: NJ
                  zip_code: 08846
                  owner:
                    username: jsmith
                  borrower:
                    source: PCLender
                    first_name: Jenny
                    last_name: Kristoff
                    email: jennyK@example.com
                    custom:
                    - field_name: custom_string
                      value: the custom field string value
                  coborrower:
                    source: PCLender
                    first_name: Anthony
                    last_name: Kristoff
                    email: anthonyK@example.com
                  loan_program:
                    loan_program: 10-year Fixed
                  loan_purpose:
                    loan_purpose: Refinance
                  loan_status:
                    loan_status: Pending
                  loan_type:
                    loan_type: Conventional Fixed Rate
                  loan_subordinate_financing_type:
                    loan_subordinate_financing_type: HELOC
                  buyers_agent:
                    source: PCLender
                    first_name: Jay
                    last_name: Jenkel
                    email: jagent@example.com
                  sellers_agent:
                    source: PCLender
                    first_name: Fred
                    last_name: Ingle
                    email: fseller@example.com
                  settlement_agent:
                    source: PCLender
                    first_name: Angie
                    last_name: Deedle
                    email: asettlement@example.com
                  account_class:
                    class_name: mortgage
                    class_type: LOAN
                  custom:
                  - field_name: custom_string
                    value: the custom field string value
              create-loan-as-user:
                value:
                  external_id: '2161006'
                  loan_number: '2161006'
                  loan_rate: '4.00'
                  loan_term: 360
                  appraised_value: '450000.00'
                  is_first_time_buyer: 0
                  address: 446 Second St
                  city: Middlesex
                  state: NJ
                  zip_code: 08846
                  loan_amount: '357904.00'
                  loan_to_value_combined: '86.24'
                  occupancy_type: Owner
                  lock_status: Locked
                  escrow_waived: 0
                  application_date: '2016-07-27 00:00:00'
                  appraisal_ordered_date: '2017-04-21 00:00:00'
                  appraisal_received_date: '2017-04-28 00:00:00'
                  closing_date: '2017-05-19 00:00:00'
                  created_date: '2017-06-06 15:51:19'
                  last_modified_date: '2017-05-15 06:55:00'
                  first_payment_date: '2017-06-01 00:00:00'
                  lock_date: '2017-04-26 00:00:00'
                  lock_expiration_date: '2017-05-25 00:00:00'
                  processing_start_date: '2016-08-05 00:00:00'
                  underwriting_submission_date: '2016-08-02 00:00:00'
                  internal_created_at: '2017-06-06 15:51:19'
                  internal_updated_at: '2017-06-06 15:51:20'
                  borrower:
                    id: 502
                  coborrower:
                    id: 502
                  loan_program:
                    loan_program: 30-year Fixed
                  loan_purpose:
                    loan_purpose: New
                  loan_status:
                    loan_status: In review
                  loan_type:
                    loan_type: Conventional Fixed Rate
                  loan_subordinate_financing_type:
                    loan_subordinate_financing_type: HELOC
                  account_class:
                    class_name: mortgage
                    class_type: LOAN
                  custom:
                  - field_name: custom_string
                    value: the custom field string value
  /v1/loan-types/{type_id}:
