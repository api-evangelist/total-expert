        required: false
        schema:
          type: string
        example: '10'
    post:
      operationId: createLoanType
      summary: Create Loan Type
      description: 'Create a loan type.

        Required Attributes:


        loan_type


        Required Relationships:


        owning_organization*


        *required if authenticated as an TE admin'
      tags:
