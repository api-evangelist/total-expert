    get:
      operationId: fetchLeadOpportunity
      summary: Fetch Lead Opportunity
      description: 'The GET endpoint returns details about the lead record, including the lead_opportunity details, any existing lead_opportunity_offers, and more.


        Attributes unique to GET


        owner


        Details about the current owner of the lead, including the following:


        attribute

        value


        email

        The user''s e-mail address as stored in the Total Expert database


        external_id

        An assignable identifier of the user as represented in a third-party system


        id

        The user''s internal Total Expert identifier


        username

        The user''s internal Total Expert username


        related_entities


        Currently returns information about the contact record to which the lead is linked. parent.id represents the contact ID.


        "related_entities": [

        {

        "relationship_type": {

        "system_name": "Contact"

        },

        "parent": [

        {

        "id": "87987456"

        }

        ]

        }

        ]


