  /v1/contact-groups/{contact_group_id}:
    get:
      operationId: fetchContactGroup
      summary: Fetch Contact Group
      description: Fetch a contact group by ID.
      tags:
      - Contact Endpoints
      responses:
        '200':
          description: Fetch Contact Group (as User)
          content:
            application/json:
              example:
                group_name: My Group
                id: 15643
                user_editable: false
      parameters:
      - name: contact_group_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateContactGroup
      summary: Update Contact Group
      description: Update an existing contact group by ID.
      tags:
      - Contact Endpoints
      responses:
        '200':
          description: Update Contact Group
          content:
            application/json:
              example: []
      parameters:
      - name: contact_group_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              group_name: My Group
    delete:
      operationId: deleteContactGroup
      summary: Delete Contact Group
      description: Deletes a contact group by ID.
      tags:
      - Contact Endpoints
      responses:
        '200':
          description: Delete Contact Group
          content:
            application/json:
              example: []
      parameters:
      - name: contact_group_id
        in: path
        required: true
        schema:
          type: string
