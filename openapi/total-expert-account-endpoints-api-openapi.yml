openapi: 3.2.0
info:
  title: Total Expert Public Account Endpoints API
  version: v1
  description: The Total Expert REST API allows you to programmatically create, retrieve, update, and delete information through various endpoints.
  contact:
    url: https://developer.totalexpert.net
servers:
- url: https://public.totalexpert.net
  description: Total Expert external API — production
- url: https://public.vt.totalexpert.net
  description: Total Expert external API — development/sandbox domain (isolated from live data; per the Vendor OAuth Integration Guide)
security:
- oauth2: []
tags:
- name: Account Endpoints
paths:
  /v1/accounts/{account_id}:
    get:
      operationId: fetchAccount
      summary: Fetch Account
      description: Fetch a specific account specified by ID.
      tags:
      - Account Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateAccount
      summary: Update Account
      description: Update an existing account by ID.
      tags:
      - Account Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              external_id: Test7
              account_name: Test7 Checking Account
              account_number: Test7
              address: 132 Fake St.
              address_2: Suite 12
              application_number: '123654789'
              city: Smallton
              last_modified_date: '2019-08-28 04:20:00'
              open_date: '2018-10-16 04:20:00'
              zip_code: '55442'
              source: An Account source
              state: Minnesota
              primary_account_holder:
                source: Test
                email: test@nationslending.com
                first_name: Firstname
                last_name: Lastname
              owner:
                username: testacct
              account_class:
                class_name: checking_account
                class_type: ACCOUNT
              account_status:
                account_status: Status One - Checking
              account_type:
                account_type: Type One - Checking
  /v1/accounts:
    get:
      operationId: fetchAccounts
      summary: Fetch Accounts
      description: Fetch a page of accounts. Specify page size and page number via the '?page[size]' and '?page[number]' GET parameters.
      tags:
      - Account Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: page[number]
        in: query
        required: false
        schema:
          type: string
        example: '1'
      - name: page[size]
        in: query
        required: false
        schema:
          type: string
        example: '10'
    post:
      operationId: createAccounts
      summary: Create Accounts
      description: Create an account
      tags:
      - Account Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      requestBody:
        content:
          application/json:
            example:
              external_id: Test5
              account_name: Test5 Checking Account
              account_number: Test5
              address: 132 Fake St.
              address_2: Suite 12
              application_number: '123654789'
              city: Smallton
              open_date: '2018-10-16 04:20:00'
              zip_code: '55442'
              source: An Account source
              state: Minnesota
              primary_account_holder:
                source: Test
                email: test@test.com
                first_name: Firstname
                last_name: Lastname
                custom:
                - field_name: custom_string
                  value: the custom field string value
              owner:
                username: testacct
              account_class:
                class_name: checking_account
                class_type: ACCOUNT
              account_status:
                account_status: Status One - Checking
              account_type:
                account_type: Type One - Checking
              custom:
              - field_name: custom_string
                value: the custom field string value
  /v1/account-types/{type_id}:
    get:
      operationId: fetchAccountType
      summary: Fetch Account Type
      description: Fetch a specific account type specified by ID.
      tags:
      - Account Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: type_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateAccountType
      summary: Update Account Type
      description: Update an existing account type by ID.
      tags:
      - Account Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: type_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              account_type: new type 3
              account_class:
                class_name: cd_account
                class_type: ACCOUNT
  /v1/account-types:
    get:
      operationId: fetchAccountTypes
      summary: Fetch Account Types
      description: Fetch a page of account types. Specify page size and page number via the '?page[size]' and '?page[number]' GET parameters.
      tags:
      - Account Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: page[number]
        in: query
        required: false
        schema:
          type: string
        example: '1'
      - name: page[size]
        in: query
        required: false
        schema:
          type: string
        example: '10'
    post:
      operationId: createAccountType
      summary: Create Account Type
      description: 'Create an account type.

        Required Attributes:


        account_type


        Required Relationships:


        owning_organization*


        *required if authenticated as an TE admin'
      tags:
      - Account Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      requestBody:
        content:
          application/json:
            example:
              account_type: new type 3
              account_class:
                class_name: cd_account
                class_type: ACCOUNT
  /v1/account-classifications:
    get:
      operationId: fetchClasses
      summary: Fetch Classes
      description: ''
      tags:
      - Account Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
  /v1/account-statuses/{status_id}:
    get:
      operationId: fetchStatus
      summary: Fetch Status
      description: Fetch a specific account status specified by ID.
      tags:
      - Account Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: status_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateStatus
      summary: Update Status
      description: Update an existing account status by ID.
      tags:
      - Account Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: status_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              account_status: New status
              account_class:
                class_name: checking_account
                class_type: ACCOUNT
  /v1/account-statuses:
    get:
      operationId: fetchStatuses
      summary: Fetch Statuses
      description: Fetch a page of account statuses. Specify page size and page number via the '?page[size]' and '?page[number]' GET parameters.
      tags:
      - Account Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: page[number]
        in: query
        required: false
        schema:
          type: string
        example: '1'
      - name: page[size]
        in: query
        required: false
        schema:
          type: string
        example: '10'
    post:
      operationId: createStatus
      summary: Create Status
      description: 'Create an account status.


        Required Attributes:


        account_status


        Required Relationships:


        owning_organization*


        *required if authenticated as an TE admin'
      tags:
      - Account Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      requestBody:
        content:
          application/json:
            example:
              account_status: New status
              account_class:
                class_name: checking_account
                class_type: ACCOUNT
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0. Obtain a token from POST /v1/token using HTTP Basic (client_id:client_secret base64-encoded) plus a grant_type body. Access tokens are bearer tokens, expires_in 3600.
      flows:
        clientCredentials:
          tokenUrl: https://public.totalexpert.net/v1/token
          scopes:
            crm: Documented example scope (Vendor OAuth Integration Guide authorize example)
            leadInteraction: Lead interaction access (documented in the collection token examples)
            loanInteraction: Loan interaction access (documented in the collection token examples)
            leadSurveyInteraction: Lead survey interaction access (documented example in the Vendor OAuth Integration Guide)
            postLeads: Post leads access (documented example in the Vendor OAuth Integration Guide)
        authorizationCode:
          authorizationUrl: https://public.totalexpert.net/v1/authorize
          tokenUrl: https://public.totalexpert.net/v1/token
          refreshUrl: https://public.totalexpert.net/v1/token
          scopes:
            crm: Documented example scope (Vendor OAuth Integration Guide authorize example)
            leadInteraction: Lead interaction access (documented in the collection token examples)
            loanInteraction: Loan interaction access (documented in the collection token examples)
            leadSurveyInteraction: Lead survey interaction access (documented example in the Vendor OAuth Integration Guide)
            postLeads: Post leads access (documented example in the Vendor OAuth Integration Guide)
externalDocs:
  description: Total Expert Public API documentation (Postman)
  url: https://documenter.getpostman.com/view/1929166/total-expert-public-api/6Z2RYyU
