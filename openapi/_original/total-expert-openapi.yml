          type: string
    patch:
      operationId: updateLeadOpportunity2
      summary: Update Lead Opportunity
      description: "The PATCH request accepts any variant of the body specified below, allowing for partial modifications\
        \ of the existing lead resource. Fields that are\n\nData Types\n\nThe PATCH is sensitive to data types,\
        \ and will error if types do not align with the types in the request body below.\n\nIf the value of a given\
        \ attribute does not match the type specified in PATCH validation, the request should fail and tell you\
        \ why.\n\nAccepted type details:\n\nInteger values, real, positive values only\n\nString values must be\
        \ wrapped in double quotation marks, as in \"hello there\"\n\nDecimals can be decimal values or integer\
        \ values\n\nBooleans must be true, false, 0, or 1. Strings 'true' and 'false' are NOT accepted.\n\nUpdating\
        \ Lead Stage\n\nlead_stage can be updated with an integer, 1 through 5, represneting the following lifecycle\
        \ stages of a lead:\n\nNew Lead\n\nContacted\n\nApplication\n\nIn Process\n\nClosed\n\nOther values can\
        \ be updated concurrently with lead_stage.\n\nUpdating Lead Opportunity Offers\n\noffers can also be updated,\
        \ but for each desired offer update, the offer_id of the given offer must be included, along with at least\
        \ one other offer attribute\n\n{\n    \"lead_opportunity\": { \n        \"property_value\": 50000000\n \
        \   },\n    \"lead_opportunity_offers\": [\n        {\n            \"offer_id\": 1,\n            \"investor\"\
        : \"Duckberg Inc\"\n        },\n        {\n            \"offer_id\": 2,\n            \"investor\": \"Duckberg\
        \ Inc\"\n        },\n    ]\n}\n\nExamples of Partial Modification Requests\n\nAs long as attributes are\
        \ nested in their correct parent attribute, they will be considered valid for updating.\n\n{\n    \"lead_stage\"\
        : 2,\n}\n\n{\n    \"first_name\": \"Scrooge\",\n    \"lead_stage\": 2,\n}\n\n{\n    \"lead_opportunity\"\
        : { \n        \"property_value\": 50000000\n    },\n    \"lead_opportunity_offers\": [\n        {\n    \
        \        \"offer_id\": 2,\n            \"investor\": \"Duckberg Inc\"\n        }\n    ]\n}\n\n{\n    \"\
        first_name\": \"Scrooge\",\n    \"last_name\": \"McDuck\",\n    \"lead_opportunity\": { \n        \"property_value\"\
        : 50000000\n    },\n    \"lead_opportunity_offers\": [\n        {\n            \"offer_id\": 2,\n      \
        \      \"investor\": \"Duckberg Inc\"\n        }\n    ]\n}"
      tags:
