        This can be used to rotate the webhook secret. The updated secret will be applied for any changes originating
        after the subscription is patched. Pending webhooks will still be sent using the old secret.'
      tags:
      - Webhooks
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              url: https://mydomain.example.com/v1/sample-webhook-consume/
              actions:
              - action: CREATED
                item: CONTACT
              - action: DELETED
                item: CONTACT
              - action: UPDATED
                item: CONTACT
              secret: new_secret
  /v1/schema/custom-fields:
    get:
      operationId: fetchCustomFieldSchema
      summary: Fetch Custom Field Schema
      description: 'Fetch the schema of the custom fields defined for your organization.


        Attributes


        Field

        Assignable

        Type

        Description


        display_name

        No

        string

        Field name that will be displayed in the TE platform


        internal_created_at

        No

        string

        Date of creation of this custom field in TE systems. Format: ''YYYY-MM-DD HH:mm:ss''


        internal_updated_at

        No

        string

        Date of last change to this custom field in TE systems. Format: ''YYYY-MM-DD HH:mm:ss''


        related_entity

        No

        relationship

        Contains two fields that specify the type of entity the custom field is tied to: entity_type (Possible values:
        loan, contact, account, user, entity) and entity_subtype, which can contain a custom string value


        system_name

        No

        string

        Field name that is used internally to identify the custom field


        data_type

        No

        string

        Custom field''s data type (Possible values: text, datetime, date, boolean, integer, decimal)


        account_class

        No

        relationship

        Contains two fields that specify the account classification the custom field is tied to: class_name, which
        is a custom string, and class_type (Possible values: LOAN, ACCOUNT)


        Filtering


        Use the ''filter=attribute_name=x,attribute_name_2=y'' query to return the list of custom field that meet
        the filter criteria. For example, to filter custom fields modified between Oct. 14, 2020 17:41:01 (UTC)
        and Oct. 15, 2020 17:41:09 (UTC), the following query could be used:


        /schema/custom-fields?filter=internal_updated_at_start=2017-10-14T17:41:01Z,internal_updated_at_end=2017-10-15T17:41:09Z


        The supported filter attributes are shown in the following table.


        Field

        Description


        internal_updated_at_start

        ISO-8601 formatted date. The start of the time range of interest, inclusive.


        internal_updated_at_end

        ISO-8601 formatted date. The end of the time range of interest, inclusive.


        internal_created_at_start

        ISO-8601 formatted date. The start of the time range of interest, inclusive.


        internal_created_at_end

        ISO-8601 formatted date. The end of the time range of interest, inclusive.


        system_name

        The internal name of the custom field


        related_entity_type

        The type of the related_entity


        account_class_name

        Name of the related account class


        account_class_type

        Type of the related account class'
      tags:
      - Schema Endpoints
      responses:
        '200':
          description: Success. See the Total Expert Public API documentation for the response shape.
