        \        \"apr\": 3.789,\n        \"market_value\": 355000,\n        \"rate_offer\": 3.625\n    },\n   \
        \ \"lead_opportunity_offers\": [\n        {\n            \"offer_id\": 1,\n            \"offer_type\": \"\
        Fixed\",\n            \"loan_program_name\": \"Conf 30 Yr Fixed\",\n            \"loan_amount\": 255000,\n\
        \            \"interest_rate\": 3.625,\n            \"term\": \"30 \",\n            \"points\": 0.75,\n\
        \            \"investor\": \"Total Expert(308)\",\n            \"lock_term\": 45,\n            \"monthly_payment\"\
        : 1367.34,\n            \"down_payment\": 295000,\n            \"apr\": 5.171\n        },\n        {\n \
        \           \"offer_id\": 2,\n            \"offer_type\": \"Fixed\",\n            \"loan_program_name\"\
        : \"Conf 15 Yr Fixed \",\n            \"loan_amount\": 255000,\n            \"interest_rate\": 4.625,\n\
        \            \"term\": \"180\",\n            \"points\": 0.75,\n            \"investor\": \"Total Expert(308)\"\
        ,\n            \"lock_term\": 30,\n            \"monthly_payment\": 1067.34,\n            \"down_payment\"\
        : 295000.00,\n            \"apr\": 6.171\n        }\n    ],\n    \"custom\": [ \n                {\n   \
        \                 \"field_name\": \"name\",\n                    \"value\": \"value\"\n                }\n\
        \    ],\n    \"owner\": {\n                \"email\": \"billfischer@example.com\",\n                \"external_id\"\
        : \"\",\n                \"id\": \"218923\",\n                \"username\": \"billfischer-example\"\n  \
        \          },\n    \"related_entities\": [\n        {\n            \"relationship_type\": {\n          \
        \      \"system_name\": \"Contact\"\n            },\n            \"parent\": [\n                {\n    \
