  /v1/leads:
    post:
      operationId: createLeadOpportunity
      summary: Create Lead Opportunity
      description: "Leads and Contacts\n\nA POST request for a new lead wil also create a new contact record, but\
        \ only if a matching contact is not found. A matching contact is one that meets this criteria:\n\nHas a\
        \ first name identical to the request first_name\n\nHas a last name identical tp the request last_name\n\
        \nHas an e-mail address or phone number field identical to those in the request\n\nIf owner_id is not in\
        \ the request, the contact meets the above matching criteria and is owned by the same organization\n\nIf\
        \ an owner_id is in the request, the contact meets the above matching criteria and is owned by the exact\
        \ same user ID\n\nA successful response from will return the ID of the new lead, and the ID of either the\
        \ new contact or the existing, matched contact:\n\n{\n    \"contact_id\": 144558,\n    \"lead_id\": 144559\n\
        }\n\nRequired Fields\n\nOne of the following combinations:\n\nfirst_name, last_name, source, email\n\nfirst_name,\
        \ last_name, source, address, city, state, zip\n\nfirst_name, last_name, source, phone_home\n\nfirst_name,\
        \ last_name, source, phone_cell\n\nfirst_name, last_name, source, phone_office\n\nOptional fields:\n\nowner_id\n\
        \nAll lead_opportunity fields,\n\nAll lead_opportunity_offers fields\n\ncustom fields\n\nLead Attributes\n\
        \nField\nData Type\nDescription\n\ntile\nstring\nThe contact's honorific/title, e.g. \"Doctor\"\n\nfirst_name\n\
        string\nThe contact's first name\n\nlast_name\nstring\nThe contact's last name\n\nsuffix\nstring\nThe contact's\
        \ suffix, e.g. \"Jr.\"\n\nnickname\nstring\nThe contact's preferred name\n\nowner_id\ninteger\nThe Total\
        \ Expert user ID that owns the contact/lead\n\naddress\nstring\nStreet address portion of contact's current\
        \ address.\n\naddress_2\nstring\nLine 2 portion of contact's current address.\n\ncity\nstring\nCity portion\
        \ of contact's current address.\n\nstate\nstring\nState portion of current contact's address. Preferred\
        \  \nformat: Two character state abbreviation, e.g. 'CA'\n\nzip_code\nstring\nZip code portion of contact's\
        \ current address.  \nPreferred format: 5 digit postal code, e.g. '90210'\n\nbirthday\nstring\nContact's\
        \ birthday, formatted as a date with 1970 as  \nthe year. Preferred format: '1970-MM-DD'\n\ncreation_date\n\
        string\nDate of creation of this contact. Preferred format:  \n'YYYY-MM-DD HH:mm:ss'\n\nlast_contacted_date\n\
        string\nDate/time of last interaction with contact. Preferred  \nformat: 'YYYY-MM-DD HH:mm:ss'\n\nemail\n\
        string\nContact's personal email address.\n\nemail_work\nstring\nContact's work email address.\n\nphone_cell\n\
        string\nContact's cell phone number, preferred format:  \n'(555)555-1234'\n\nphone_home\nstring\nContact's\
        \ home phone number, preferred format:  \n'(555)555-1234'\n\nphone_office\nstring\nContact's office phone\
        \ number, preferred format:  \n'(555)555-1234'\n\nok_to_call\nboolean\nIndicator whether it is OK to call\
        \ this contact.  \nTrue or 1 - Yes  \nFalse or 0 -No\n\nok_to_email\nboolean\nIndicator whether it is OK\
        \ to call this contact.  \nTrue or 1 - Yes  \nFalse or 0 -No\n\nok_to_mail\nboolean\nIndicator whether it\
        \ is OK to call this contact.  \nTrue or 1 - Yes  \nFalse or 0 -No\n\nreferred_by\nstring\nName of person\
        \ by whom this contact was referred.\n\nsource\nstring\nSource of the contact.\n\ncredit_score\nstring\n\
        Total Expert credit rating of the lead.  \nAvailable values:  \nExcellent, Good, Fair, Poor, Very Poor.\n\
        \ncredit_score_date\nstring\nDate/time of contact's last received credit score.  \nPreferred format: 'YYYY-MM-DD\
        \ HH:mm:ss'\n\nOpportunity Attributes\n\nField\nData Type\nDescription\n\nproperty_value\ninteger\n\nproperty_county\n\
        string\nCounty which the property to be financed is  \nlocated, e.g. Alameda\n\nproperty_zip\nstring\nPostal\
        \ Code of the property to be financed, e.g.  \n90210\n\nproperty_state\nstring\nState which the property\
        \ is located. Preferred  \nformat is two character state abbreviation, e.g.  \n'CA'\n\nproperty_msa\nstring\n\
        Metropolitan area which the property is located,  \ne.g. 'Greater Los Angeles'\n\nloan_amount\ninteger\n\
        Estimated loan amount requested, e.g. 250000\n\nloan_down_payment\ninteger\nEstimated down payment requested,\
        \ e.g. 100000\n\nloan_cash_out\ninteger\nEstimated additional cash out amount requested,  \ne.g. 10000\n\
        \nproperty_type\nstring\nType of property to be financed, e.g. 'Single  \nFamily Dettached'\n\nproperty_use\n\
        string\nOccupancy of the property to be financed, e.g.  \n'Owner Occupied'\n\nloan_request_type\nstring\n\
        Loan purpose, e.g. “Purchase’ or “Cash-out  \nRefinance’\n\nlead_price\nstring\nAmount charged by source\
        \ to generate lead\n\ntracking_number\nstring\nUnique identifier assigned by the source for the  \nlead\n\
        \nannual_income\ndecimal\nAnnual income of the lead.\n\nfirst_time_buyer\nboolean\nIndicator if lead is\
        \ a first time home buyer. True or 1  \n= Is a First Time Home Buyer\n\nhas_agent\nboolean\nIndicator if\
        \ lead is working with a real estate  \nagent. True or 1 = Is working with an Agent\n\nis_military\nboolean\n\
        Indicator if lead is active duty or a veteran. True or 1  \n= is active duty or a veteran\n\nself_credit_rating\n\
        string\nEstimated credit rating of contact. Preferred  \nvalues: 'Excellent', 'Good', 'Fair', 'Poor', 'Very\
        \  \nPoor'\n\nbankruptcy\nboolean\nIndicator if lead has had bankruptcy. True or 1 = has had  \nbankruptcy\n\
        \nforeclosure\nboolean\nIndicator if lead has had foreclosure. True or 1 = has had  \nforeclosure\n\nfound_home\n\
        boolean\nIndicator if lead has located the property they  \nintend to finance. True or 1 = They have located\
        \ a  \nhome.\n\nproperty_purchase_price\ndecimal\nContracted purchase price of the property to be  \nfinanced,\
        \ e.g. 350000\n\nis_fha_eligible\nboolean\nIndicator if lead is eligible for FHA product. True or 1 = Is\
        \  \neligible for FHA product.\n\nis_va_loan\nboolean\nIndicator of the offer selected is VA eligible. \
        \ \nTrue or 1 = VA Offer\n\npresent_ltv\ndecimal\nCurrent Loan To Value ratio of the property to be  \n\
        financed. Rounded to the nearest thousandth, e.g.  \n71.123\n\nproposed_ltv\ndecimal\nRequested Loan To\
        \ Value ratio of the property to  \nbe financed. Rounded to the nearest thousandth,  \ne.g. 74.123\n\nterm\n\
        string\nRequested or selected term of the offer, e.g. 30  \nyear fixed\n\nestimated_payment\ndecimal\nEstimated\
        \ payment of the selected offer, e.g.  \n1234.55\n\napr\ndecimal\nAnnual Percentage Rate of the selected\
        \ offer.  \nRounded to the nearest thousandth, e.g. 3.625\n\nmarket_value\ndecimal\nMarket value of the\
        \ property to be financed.  \nRounded to the nearest thousandth, e.g.  \n350000.000\n\nrate_offer\ndecimal\n\
        Note Rate of the selected offer. Rounded to the  \nnearest thousandth, e.g. 3.125\n\nOffers Attributes\n\
        \nThe following represents the attributes of one offer object. Offers can be passed in an array [ ].\n\n\
        Field\nData Type\nDescription\n\noffer_id\ninteger\n\noffer_type\nstring\nAmortization type of the offer,\
        \ ex. Fixed\n\nloan_program_name\nstring\nName of the loan program of the offer, ex. Conf 30 Yr  \nFixed\n\
        \nloan_amount\ndecimal\nLoan amount used to generate the offer, ex. 250000\n\ninterest_rate\ndecimal\nInterest\
        \ rate of the offer, ex. 3.750\n\nterm\nstring\nAmortization term of the offer, ex. 30\n\npoints\ndecimal\n\
        Price of the offer, ex. 1\n\ninvestor\nstring\nInvestor used to generate the offer, ex. Wells Fargo\n\n\
        lock_term\ninteger\nLock period used to generate the offer, ex. 45\n\nmonthly_payment\ndecimal\nMonthly\
        \ Principle and Interest payment of the offer\n\ndown_payment\ndecimal\nDown payment used to generate the\
        \ offer\n\napr\ndecimal\nAnnual Percentage Rate of the offer\n\nCustom Field Attributes\n\nThe optional\
        \ custom attribute, if specified, should contain one or more objects, each object representing one custom\
        \ field name and its value. The custom fields should be wrapped in an array:\n\n\"custom\": [\n        {\n\
        \            \"field_name\": \"first_datetime\", \n            \"value\": \"07/21/2023 00:00:00\"\n    \
        \    },\n        {\n            \"field_name\": \"date\", \n            \"value\": \"10/30/2023\"\n    \
        \    }\n    ]\n\nA custom field definition of type \"contact\" that matches the given field_name must already\
        \ exist for the POST to succeed. A POST request will not create new, adhoc custom field definitions.\n\n\
        Attributes of a custom field\n\nField\nData Type\nDescription\n\nfield_name\nstring\nThe system name of\
        \ the custom field.\n\nvalue\nvariable, according to definition\nA custom value matching the data type of\
        \ the custom field definition."
      tags:
      - ALM Leads (formerly Lead Opportunities)
      responses:
        '200':
          description: With Owner
          content:
            application/json:
              example:
                contact_id: 58
                lead_id: 61
      requestBody:
        content:
          application/json:
            example:
              title: Dr.
              first_name: Bill
              last_name: Nye
