  /v1/leads/{lead_id}:
    get:
      operationId: fetchLeadOpportunity
      summary: Fetch Lead Opportunity
      description: "The GET endpoint returns details about the lead record, including the lead_opportunity details,\
        \ any existing lead_opportunity_offers, and more.\n\nAttributes unique to GET\n\nowner\n\nDetails about\
        \ the current owner of the lead, including the following:\n\nattribute\nvalue\n\nemail\nThe user's e-mail\
